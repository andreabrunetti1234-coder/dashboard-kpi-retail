<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard KPI Retail</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #17212b;
      --muted: #5b6673;
      --line: #dde5ef;
      --accent: #0b5cad;
      --accent-2: #16837a;
      --warn: #b45309;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.45;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      max-width: 760px;
    }

    .badge {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--muted);
      padding: 8px 10px;
      font-size: 13px;
      white-space: nowrap;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .kpi,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .kpi {
      padding: 14px;
      min-height: 96px;
    }

    .kpi span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .kpi strong {
      display: block;
      font-size: 24px;
      line-height: 1.1;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 14px;
      align-items: start;
    }

    .panel {
      padding: 16px;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 17px;
      letter-spacing: 0;
    }

    .chart {
      display: grid;
      gap: 9px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 74px 1fr 92px;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }

    .bar-track {
      height: 12px;
      background: #e8eef5;
      overflow: hidden;
      border-radius: 999px;
    }

    .bar {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
    }

    .bar.alt { background: var(--accent-2); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--line);
      text-align: right;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      color: var(--muted);
      font-weight: 700;
    }

    .insights {
      margin: 0;
      padding-left: 18px;
      color: var(--ink);
    }

    .insights li {
      margin: 7px 0;
    }

    @media (max-width: 900px) {
      .kpi-grid,
      .layout {
        grid-template-columns: 1fr;
      }

      header {
        display: block;
      }

      .badge {
        display: inline-block;
        margin-top: 12px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Dashboard KPI Retail</h1>
        <p class="subtitle">Report operativo su dataset retail simulato: ricavi, marginalita, ordini, canali, categorie, resi e tempi di consegna.</p>
      </div>
      <div class="badge">Dataset simulato | 2025</div>
    </header>

    <section class="kpi-grid" id="kpis"></section>

    <div class="layout">
      <div>
        <section class="panel">
          <h2>Trend mensile ricavi</h2>
          <div class="chart" id="monthlyChart"></div>
        </section>

        <section class="panel">
          <h2>Performance per canale</h2>
          <table id="channelTable"></table>
        </section>
      </div>

      <div>
        <section class="panel">
          <h2>Ricavi per categoria</h2>
          <div class="chart" id="categoryChart"></div>
        </section>

        <section class="panel">
          <h2>Insight operativi</h2>
          <ul class="insights" id="insights"></ul>
        </section>
      </div>
    </div>
  </main>

  <script>
    const data = {"overview": {"orders": 950, "revenue": 201136.62, "profit": 74870.59, "margin_rate": 37.22, "avg_order_value": 211.72, "return_rate": 5.68, "avg_delivery_days": 3.23}, "monthly": [{"month": "2025-01", "orders": 70, "revenue": 13600.25, "profit": 5209.32, "return_rate": 7.14}, {"month": "2025-02", "orders": 69, "revenue": 13675.75, "profit": 5144.29, "return_rate": 5.8}, {"month": "2025-03", "orders": 78, "revenue": 15774.89, "profit": 5737.63, "return_rate": 6.41}, {"month": "2025-04", "orders": 67, "revenue": 12300.34, "profit": 4647.21, "return_rate": 5.97}, {"month": "2025-05", "orders": 81, "revenue": 18761.26, "profit": 7001.29, "return_rate": 2.47}, {"month": "2025-06", "orders": 87, "revenue": 17614.06, "profit": 6437.5, "return_rate": 2.3}, {"month": "2025-07", "orders": 84, "revenue": 14155.42, "profit": 5286.5, "return_rate": 8.33}, {"month": "2025-08", "orders": 84, "revenue": 13950.07, "profit": 5145.4, "return_rate": 7.14}, {"month": "2025-09", "orders": 79, "revenue": 15694.41, "profit": 6003.67, "return_rate": 5.06}, {"month": "2025-10", "orders": 77, "revenue": 15745.62, "profit": 5907.18, "return_rate": 5.19}, {"month": "2025-11", "orders": 88, "revenue": 30259.59, "profit": 10979.9, "return_rate": 3.41}, {"month": "2025-12", "orders": 86, "revenue": 19604.96, "profit": 7370.7, "return_rate": 9.3}], "by_channel": [{"channel": "Online", "orders": 490, "revenue": 104840.89, "profit": 38233.22, "margin_rate": 36.47, "return_rate": 7.14}, {"channel": "Store", "orders": 291, "revenue": 61505.02, "profit": 23328.09, "margin_rate": 37.93, "return_rate": 4.47}, {"channel": "Partner", "orders": 169, "revenue": 34790.71, "profit": 13309.28, "margin_rate": 38.26, "return_rate": 3.55}], "by_category": [{"category": "Elettronica", "orders": 213, "revenue": 90683.11, "profit": 28367.6, "margin_rate": 31.28}, {"category": "Casa", "orders": 201, "revenue": 35220.79, "profit": 14445.65, "margin_rate": 41.01}, {"category": "Sport", "orders": 166, "revenue": 31466.48, "profit": 11646.64, "margin_rate": 37.01}, {"category": "Moda", "orders": 221, "revenue": 29223.55, "profit": 13241.85, "margin_rate": 45.31}, {"category": "Beauty", "orders": 149, "revenue": 14542.69, "profit": 7168.85, "margin_rate": 49.3}], "by_region": [{"region": "Centro", "orders": 313, "revenue": 68756.74, "profit": 25241.51}, {"region": "Nord", "orders": 289, "revenue": 59539.1, "profit": 22248.33}, {"region": "Sud", "orders": 236, "revenue": 45451.36, "profit": 17279.95}, {"region": "Isole", "orders": 112, "revenue": 27389.42, "profit": 10100.8}]};

    const eur = value => new Intl.NumberFormat('it-IT', {
      style: 'currency',
      currency: 'EUR',
      maximumFractionDigits: 0
    }).format(value);

    const pct = value => `${Number(value).toFixed(1)}%`;

    const overview = data.overview;
    const kpis = [
      ['Ricavi', eur(overview.revenue)],
      ['Profitto lordo', eur(overview.profit)],
      ['Margine', pct(overview.margin_rate)],
      ['Valore medio ordine', eur(overview.avg_order_value)],
      ['Tasso reso', pct(overview.return_rate)]
    ];

    document.querySelector('#kpis').innerHTML = kpis.map(([label, value]) => `
      <article class="kpi"><span>${label}</span><strong>${value}</strong></article>
    `).join('');

    function renderBars(target, rows, labelKey, valueKey, alt = false) {
      const max = Math.max(...rows.map(row => row[valueKey]));
      document.querySelector(target).innerHTML = rows.map(row => {
        const width = Math.max(4, Math.round((row[valueKey] / max) * 100));
        return `
          <div class="bar-row">
            <span>${row[labelKey]}</span>
            <div class="bar-track"><div class="bar ${alt ? 'alt' : ''}" style="width: ${width}%"></div></div>
            <strong>${eur(row[valueKey])}</strong>
          </div>
        `;
      }).join('');
    }

    renderBars('#monthlyChart', data.monthly, 'month', 'revenue');
    renderBars('#categoryChart', data.by_category, 'category', 'revenue', true);

    document.querySelector('#channelTable').innerHTML = `
      <thead>
        <tr>
          <th>Canale</th>
          <th>Ordini</th>
          <th>Ricavi</th>
          <th>Margine</th>
          <th>Resi</th>
        </tr>
      </thead>
      <tbody>
        ${data.by_channel.map(row => `
          <tr>
            <td>${row.channel}</td>
            <td>${row.orders}</td>
            <td>${eur(row.revenue)}</td>
            <td>${pct(row.margin_rate)}</td>
            <td>${pct(row.return_rate)}</td>
          </tr>
        `).join('')}
      </tbody>
    `;

    const topChannel = data.by_channel[0];
    const topCategory = data.by_category[0];
    const bestMonth = [...data.monthly].sort((a, b) => b.revenue - a.revenue)[0];
    const worstReturn = [...data.by_channel].sort((a, b) => b.return_rate - a.return_rate)[0];

    document.querySelector('#insights').innerHTML = [
      `Il canale principale per ricavi e' <strong>${topChannel.channel}</strong> con ${eur(topChannel.revenue)}.`,
      `La categoria con ricavi piu' alti e' <strong>${topCategory.category}</strong>.`,
      `Il mese migliore e' <strong>${bestMonth.month}</strong>, utile per leggere stagionalita e picchi commerciali.`,
      `Il canale da monitorare per i resi e' <strong>${worstReturn.channel}</strong>, con tasso reso pari a ${pct(worstReturn.return_rate)}.`
    ].map(item => `<li>${item}</li>`).join('');
  </script>
</body>
</html>
